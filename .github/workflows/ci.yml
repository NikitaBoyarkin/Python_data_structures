name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Legacy learning scripts with no test suite, so the gate is the one thing
      # that can honestly be asserted: every file still parses. Some filenames
      # contain spaces, which compileall handles.
      - name: Byte-compile every script
        run: python -m compileall -q .
